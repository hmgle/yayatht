[workspace]
members = [
    "crates/cli",
    "crates/dataplane",
    "crates/namespace",
    "crates/packet",
    "crates/proxy-proto",
    "crates/sys",
    "crates/tcp-adapter",
    "crates/test-support",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
repository = "https://github.com/hmgle/yayatht"

[workspace.dependencies]
arrayvec = "0.7.6"
base64 = "0.22.1"
bitflags = "2.9.4"
clap = { version = "4.5.48", features = ["derive"] }
getrandom = "0.3.3"
libc = "0.2.176"
linux-raw-sys = { version = "0.12.1", features = ["net"] }
rustix = { version = "1.1.2", features = ["event", "fs", "mount", "net", "pipe", "process", "rand", "runtime", "system", "thread", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
zeroize = "1.8.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
