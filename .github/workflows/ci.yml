name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject local development paths
        shell: bash
        run: |
          if git grep -nE '/(home|Users)/[^/[:space:]]+' -- .; then
            echo "tracked files contain a local development path" >&2
            exit 1
          fi
      - name: Verify source license headers
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r file; do
            if ! head -n 6 "$file" | grep -Eq '^(//|#) SPDX-FileCopyrightText: 2026 hmgle$'; then
              echo "missing SPDX copyright: $file" >&2
              missing=1
            fi
            if ! head -n 6 "$file" | grep -Eq '^(//|#) SPDX-License-Identifier: GPL-3.0-only$'; then
              echo "missing SPDX license: $file" >&2
              missing=1
            fi
          done < <(git ls-files '*.rs' '*.py')
          exit "$missing"

  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace -- --test-threads=1

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.93.1"
      - run: cargo check --workspace --all-targets

  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl
      - run: cargo check --workspace --target x86_64-unknown-linux-musl
      - run: cargo check --workspace --target aarch64-unknown-linux-gnu
      - run: cargo check --workspace --target aarch64-unknown-linux-musl

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
